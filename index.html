<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Alviney 💙</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Background Music -->
  <audio id="bgMusic" loop>
    <source src="blue.mp3" type="audio/mpeg">
  </audio>

  <!-- Opening Screen -->
  <div class="opening" onclick="startSurprise()">

    <div class="open-box">

      <h1>💌 Tap To Open</h1>

      <p>Special surprise for my love 💙</p>

      <span>June 14th ✨</span>

    </div>

  </div>

  <!-- Stars Background -->
  <div class="stars"></div>

  <!-- Main Content -->
  <div class="container" id="mainContent">

    <h1 class="title glow">
      HAPPIEE BIRTHDAY ALVINEYYY 💙✨
    </h1>

    <h3 class="date">
      June 14th — The day my favourite person was born 🫂💙
    </h3>

    <!-- Slideshow -->
    <div class="slideshow">

      <img src="img1.jpg" class="slide active">

      <img src="img2.jpg" class="slide">

      <img src="img3.jpg" class="slide">

      <img src="img4.jpg" class="slide">

    </div>

    <!-- Message Box -->
    <div class="message-box">

      <p id="typingText"></p>

    </div>

    <!-- Ending -->
    <div class="ending">

      <h2>I Love You So Muchhhh 😚💙</h2>

      <p>Forever us 🫂✨</p>

    </div>

  </div>

  <script src="script.js"></script>

</body>

</html>
